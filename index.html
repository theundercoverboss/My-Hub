function play(n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();(SND[n]||SND.chime).forEach(([f,t,d,w])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)})}catch(e){}}

function nxt(d,rep,n){const x=pd(d);if(rep==='daily')x.setDate(x.getDate()+1);else if(rep==='weekly')x.setDate(x.getDate()+7);else if(rep==='custom')x.setDate(x.getDate()+Math.max(1,n||1));else if(rep==='monthly'){const dd=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(dd,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}else if(rep==='yearly')x.setFullYear(x.getFullYear()+1);return ymd(x)}
